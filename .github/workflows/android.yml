name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          # Explicitly install only the packages used by this project.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test and build without private certificates
        run: bash gradlew testDebugUnitTest assembleDebug --console=plain
      - name: Check renewal failure handling without network calls
        run: python3 tools/test_renew_script.py
